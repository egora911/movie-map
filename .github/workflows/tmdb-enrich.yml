name: TMDB enrichment probe
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/enrich-tmdb.js'
      - '.github/workflows/tmdb-enrich.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/enrich-tmdb.js
