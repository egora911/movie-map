name: Enrich Movie Map from PoiskKino API
on:
  push:
    branches: [data/tmdb-enrichment]
    paths:
      - 'scripts/enrich-tmdb.js'
      - '.github/workflows/tmdb-enrich.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/tmdb-enrichment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enrich movies.json
        env:
          POISKKINO_API_KEY: ${{ secrets.POISKKINO_API_KEY }}
        run: node scripts/enrich-tmdb.js
      - name: Commit enrichment
        run: |
          if git diff --quiet -- movies.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "movie-map-bot"
          git config user.email "movie-map-bot@users.noreply.github.com"
          git add movies.json
          git commit -m "Enrich Movie Map with PoiskKino metadata"
          git push origin HEAD:data/tmdb-enrichment
