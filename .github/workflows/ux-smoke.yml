name: Movie Map UX smoke tests
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - movies.json
      - tests/ux-smoke.cjs
      - .github/workflows/ux-smoke.yml
permissions:
  contents: read
jobs:
  ux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - run: node tests/ux-smoke.cjs
