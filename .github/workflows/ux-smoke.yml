name: Movie Map UX smoke tests
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - movies.json
      - tests/ux-smoke.cjs
      - .github/workflows/ux-smoke.yml
permissions:
  contents: read
jobs:
  ux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright@1.56.1
      - run: node tests/ux-smoke.cjs
      - run: npx playwright install chromium
      - run: node tests/ux-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-screenshots
          path: ux-*.png
          if-no-files-found: ignore
